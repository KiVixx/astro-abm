[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-abm"
version = "0.1.0"
description = "Astro ABM hourly data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-binance>=1.0.19",
  "requests>=2.31.0",
  "psycopg[binary]>=3.1.18",
  "pyswisseph>=2.10.3.2",
  "pandas>=2.2.0",
  "apscheduler>=3.10.4",
  "h5py>=3.11.0",
  "python-dotenv>=1.0.1",
  "pyarrow>=24.0.0",
  "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
astro-abm-live = "astro_abm.etl.live:main"
astro-abm-maintain-hourly = "astro_abm.etl.maintain_hourly:main"
astro-abm-maintain-daily = "astro_abm.etl.maintain_daily:main"
astro-abm-maintenance-daemon = "astro_abm.etl.maintenance_daemon:main"
astro-abm-data-completeness = "astro_abm.analysis.data_completeness:main"
astro-abm-feature-summary = "astro_abm.analysis.feature_summary:main"
astro-abm-export-training-dataset = "astro_abm.analysis.training_dataset:main"
astro-abm-astro-volatility-alpha = "astro_abm.analysis.astro_volatility_alpha:main"
astro-abm-astro-risk-calendar = "astro_abm.analysis.astro_risk_calendar:main"
astro-abm-backfill-binance-spot = "astro_abm.etl.backfill_binance_spot:main"
astro-abm-backfill-ccdata-aggregate = "astro_abm.etl.backfill_ccdata_aggregate:main"
astro-abm-build-price-features = "astro_abm.etl.build_price_features:main"
astro-abm-build-regime-features = "astro_abm.etl.build_regime_features:main"
astro-abm-build-regime-labels = "astro_abm.etl.build_regime_labels:main"
astro-abm-backfill-binance-derivatives = "astro_abm.etl.backfill_binance_derivatives:main"
astro-abm-backfill-binance-vision-metrics = "astro_abm.etl.backfill_binance_vision_metrics:main"
astro-abm-collect-binance-open-interest = "astro_abm.etl.collect_binance_open_interest:main"
astro-abm-backfill-ephemeris = "astro_abm.etl.backfill_ephemeris:main"
astro-abm-backfill-space-weather = "astro_abm.etl.backfill_space_weather:main"
astro-abm-backfill-goes-xray = "astro_abm.etl.backfill_goes_xray:main"
astro-abm-backfill-noaa-swpc-recent = "astro_abm.etl.backfill_noaa_swpc_recent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "astro_research/src"]
testpaths = ["tests", "astro_research/tests"]
