dataset:
  data_version: "market_daily_v1"

providers:
  fred:
    api_key_env: "FRED_API_KEY"

assets:
  BTC:
    source: "local_csv"
    symbol: "BTC"
    timezone: "UTC"
    start_date: "2010-07-17"
    currency: "USD"
    path: "astro_research/data/market_daily/BTC.csv"

  ETH:
    source: "local_csv"
    symbol: "ETH"
    timezone: "UTC"
    start_date: "2015-08-07"
