services:
  questdb:
    image: questdb/questdb:latest
    container_name: abm-questdb
    restart: unless-stopped
    environment:
      TZ: UTC
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb

  maintenance:
    build:
      context: .
    container_name: abm-maintenance
    restart: unless-stopped
    depends_on:
      - questdb
    profiles:
      - maintenance
    environment:
      TZ: UTC
      QUESTDB_HOST: questdb
      QUESTDB_PG_PORT: 8812
      QUESTDB_USER: ${QUESTDB_USER:-admin}
      QUESTDB_PASSWORD: ${QUESTDB_PASSWORD:-quest}
      QUESTDB_DATABASE: ${QUESTDB_DATABASE:-qdb}
      ASTRO_ABM_CRYPTO_SYMBOLS: ${ASTRO_ABM_CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT}
      ASTRO_ABM_RUN_ON_START: ${ASTRO_ABM_RUN_ON_START:-hourly}
      ASTRO_ABM_DAILY_HOUR: ${ASTRO_ABM_DAILY_HOUR:-0}
      ASTRO_ABM_DAILY_MINUTE: ${ASTRO_ABM_DAILY_MINUTE:-20}
      ASTRO_ABM_EPHEMERIS_FORWARD_DAYS: ${ASTRO_ABM_EPHEMERIS_FORWARD_DAYS:-370}
      ASTRO_ABM_REFRESH_PRODUCT_SNAPSHOTS: ${ASTRO_ABM_REFRESH_PRODUCT_SNAPSHOTS:-1}
      ASTRO_ABM_PRODUCT_SNAPSHOT_HOUR: ${ASTRO_ABM_PRODUCT_SNAPSHOT_HOUR:-1}
      ASTRO_ABM_PRODUCT_SNAPSHOT_MINUTE: ${ASTRO_ABM_PRODUCT_SNAPSHOT_MINUTE:-10}
      ASTRO_ABM_PRODUCT_SNAPSHOT_MODE: ${ASTRO_ABM_PRODUCT_SNAPSHOT_MODE:-local-full}
      ASTRO_ABM_PRODUCT_SNAPSHOT_INGEST: ${ASTRO_ABM_PRODUCT_SNAPSHOT_INGEST:-0}
      ASTRO_ABM_REFRESH_LOCAL_DATA: ${ASTRO_ABM_REFRESH_LOCAL_DATA:-0}
      ASTRO_ABM_ACCEPT_RESEARCH_LOCAL_TERMS: ${ASTRO_ABM_ACCEPT_RESEARCH_LOCAL_TERMS:-0}
      FRED_API_KEY: ${FRED_API_KEY:-}
    command:
      - astro-abm-maintenance-daemon
    volumes:
      - astro-cache:/root/.cache/astro-abm
      - ./astro_research/output:/app/astro_research/output
      - ./astro_research/data/local:/app/astro_research/data/local

volumes:
  questdb-data:
  astro-cache:
